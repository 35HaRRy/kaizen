name: Kaizen CI and API deployment

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm -C api build
      - run: pnpm build
      - run: python3 -m unittest discover -s ops/tests -v
      - run: bash -n ops/deploy.sh && bash -n ops/package.sh
      - run: shellcheck ops/deploy.sh ops/package.sh
      - name: Build and exercise the real API deployment/rollback
        run: |
          docker build -f api/Dockerfile -t kaizen-api:ci .
          RUN_DOCKER_DEPLOY_TESTS=1 VERIFY_API_IMAGE=kaizen-api:ci \
            python3 -m unittest discover -s ops/tests -p test_docker_deploy.py -v

  publish:
    needs: checks
    if: github.repository_owner == '35HaRRy' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/35harry/kaizen-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package exact image digest and runtime files
        env:
          IMAGE: ghcr.io/35harry/kaizen-api@${{ steps.image.outputs.digest }}
        run: bash ops/package.sh "$IMAGE" "$GITHUB_SHA" release-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: api-release-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: kaizen-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-release-${{ github.sha }}
          path: release-bundle
      - name: Validate deployment inputs
        run: |
          python3 - <<'PY'
          import os, re
          env = os.environ
          assert re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9.-]*', env['DEPLOY_HOST'])
          assert re.fullmatch(r'[a-z_][a-z0-9_-]*', env['DEPLOY_USER'])
          assert env['DEPLOY_PORT'].isdigit() and 1 <= int(env['DEPLOY_PORT']) <= 65535
          assert re.fullmatch(r'(/[a-zA-Z0-9_-]+)+', env['DEPLOY_ROOT'])
          assert re.fullmatch(r'https://[a-zA-Z0-9][a-zA-Z0-9.-]*(?::[0-9]{1,5})?', env['DEPLOY_ORIGIN'])
          PY
      - name: Skip superseded commits
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Main advanced; skipping this older deployment'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install SSH identity and verified host keys
        if: steps.freshness.outputs.deploy == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy-ssh/key" >/dev/null
      - name: Transfer package and deploy automatically
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          options=(-i "$RUNNER_TEMP/deploy-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          stage="$DEPLOY_ROOT/incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$target" "umask 077; mkdir '$stage'"
          scp "${options[@]}" -P "$DEPLOY_PORT" -r release-bundle/. "$target:$stage/"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$target" \
            "bash '$stage/deploy.sh' deploy '$DEPLOY_ROOT' '$stage' '$DEPLOY_ORIGIN'"
      - name: Remove runner SSH material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/known_hosts"
